[package]
name = "dimax"
version = "0.3.0"
edition = "2024"
description = "A terminal multiplexer with persistent sessions and synchronized workspaces"
readme = "README.txt"
repository = "https://github.com/DIvkov575/dimax"
homepage = "https://github.com/DIvkov575/dimax"
keywords = ["terminal", "multiplexer", "tui", "shell"]
categories = ["command-line-utilities"]
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.txt"]

[dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
clap = { version = "4.6.4", features = ["derive"] }
libc = "0.2.189"
portable-pty = "0.9.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sendfd = { version = "0.4", features = ["tokio"] }
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tokio = { version = "1.53.1", features = ["full"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }
wezterm-term = { version = "0.1.0-fork.5", package = "tattoy-wezterm-term" }

[[bin]]
name = "bench_hot_paths"
path = "src/bin/bench_hot_paths.rs"
